name: Cargar localidades oficiales

# Solo se lanza a mano: GitHub -> Actions -> "Cargar localidades oficiales" -> Run workflow.
# Baja de la API Georef (datos.gob.ar, fuente INDEC) las localidades y
# localidades censales de Córdoba, y la población por municipio del
# Censo 2022 (INDEC). Las guarda en public.localidades_oficiales.
# - vista_previa: solo cuenta, no guarda nada.
# - aplicar: guarda (si se corre dos veces, no duplica: actualiza).
# Solo imprime números. No sube archivos.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'vista_previa (solo cuenta) o aplicar (guarda en la base)'
        required: true
        type: choice
        default: vista_previa
        options:
          - vista_previa
          - aplicar

permissions:
  contents: read

concurrency:
  group: leadhunter-localidades
  cancel-in-progress: false
  queue: max

jobs:
  cargar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Instalar Node
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Instalar dependencias y compilar
        working-directory: scraper
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      # Única etapa con acceso a los secretos de Supabase.
      # El modo se pasa por variable de entorno (nunca pegado en el script).
      - name: Cargar localidades (solo imprime números)
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MODO: ${{ inputs.modo }}
        run: node dist/cargar-localidades.js
